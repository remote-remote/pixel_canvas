<html>

  <body>
    <h1>PixelCanvas</h1>
    <select id="color-select">

      <option value="f00">Red</option>
      <option value="0f0">Green</option>

    <canvas id="pixcan" height="1024" width="1024"></canvas>

<style>
#pixcan {
  border: 1px solid black;
